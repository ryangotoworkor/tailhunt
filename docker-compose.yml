# tailhunt: six Go services on one Postgres.
# Host ports: gateway 8880, search 8881, inventory 8882, quote 8883,
# profile 8884, risk 8885, Postgres 54389, Jaeger UI 16698 (OTLP 4337 grpc /
# 4338 http), Prometheus 9198, Grafana 3098. Total memory cap ~1.09 GiB.
# Always run with: docker-compose -p tailhunt ...
name: tailhunt

x-go: &go
  image: tailhunt:dev
  pull_policy: never # built once by the gateway service below
  restart: unless-stopped
  mem_limit: 48m
  environment: &goenv
    SEARCH_URL: http://search:8881
    INVENTORY_URL: http://inventory:8882
    QUOTE_URL: http://quote:8883
    PROFILE_URL: http://profile:8884
    RISK_URL: http://risk:8885
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    LOG_DIR: /logs
    GOMEMLIMIT: 40MiB
  volumes: ["./var/logs:/logs"]

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 192m
    environment:
      POSTGRES_USER: tailhunt
      POSTGRES_PASSWORD: tailhunt # local demo database, not a secret
      POSTGRES_DB: tailhunt
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=50", "-c", "work_mem=2MB"]
    ports: ["54389:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tailhunt"]
      interval: 2s
      retries: 30

  gateway:
    <<: *go
    build: .
    command: ["gateway"]
    # More than the other services: during the learn run it holds the run's
    # evidence (traces, Prometheus ranges, logs) while the fault is active;
    # at 48m it was OOM-killed on the p99 stage and lost the run.
    mem_limit: 96m
    environment:
      <<: *goenv
      GOMEMLIMIT: 80MiB
      DATABASE_URL: postgres://tailhunt:tailhunt@postgres:5432/tailhunt?application_name=tailhunt-gateway
      JWT_SECRET: ${JWT_SECRET:-dev-only-not-a-real-secret}
      PROM_URL: http://prometheus:9090
      JAEGER_QUERY_URL: http://jaeger:16686
      ANALYSIS_DIR: /analysis
    volumes: ["./var/logs:/logs", "./analysis/out:/analysis:ro"]
    ports: ["8880:8880"]
    depends_on: {postgres: {condition: service_healthy}, search: {condition: service_started}, inventory: {condition: service_started}}

  search:
    <<: *go
    command: ["search"]
    ports: ["8881:8881"]

  inventory:
    <<: *go
    command: ["inventory"]
    environment:
      <<: *goenv
      DATABASE_URL: postgres://tailhunt:tailhunt@postgres:5432/tailhunt?application_name=tailhunt-inventory
      DB_MAX_OPEN: "6"
    ports: ["8882:8882"]
    depends_on: {postgres: {condition: service_healthy}}

  quote:
    <<: *go
    command: ["quote"]
    ports: ["8883:8883"]

  profile:
    <<: *go
    command: ["profile"]
    ports: ["8884:8884"]

  risk:
    <<: *go
    command: ["risk"]
    ports: ["8885:8885"]

  # @learn:jaeger-memory
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    restart: unless-stopped
    # In-memory storage. 8000 traces got it OOM-killed at 160m during a
    # 90 s incident (55 req/s, ~8 spans each); 3000 plus a soft Go memory
    # limit keeps it well under the cap.
    mem_limit: 200m
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "3000"
      GOMEMLIMIT: 150MiB
    ports: ["16698:16686", "4337:4317", "4338:4318"]
  # @learn:end jaeger-memory

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    mem_limit: 160m
    volumes: ["./deploy/prometheus:/etc/prometheus:ro"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=3h"]
    ports: ["9198:9090"]

  grafana:
    image: grafana/grafana:12.2.1
    restart: unless-stopped
    mem_limit: 200m
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tailhunt.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3098:3000"]

volumes:
  pgdata:
